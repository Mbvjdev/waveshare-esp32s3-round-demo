name: Build

on:
  push:
  pull_request:

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -e waveshare-esp32s3
      - name: Check project metadata
        run: python3 test/test_project_files.py
